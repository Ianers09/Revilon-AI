name: Keep Revilon awake

on:
  schedule:
    # Render free services sleep after 15 idle minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Revilon health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://revilonai.com/health/
